<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e7">
<title>Unhinged Princess</title>
<meta property="og:title" content="Unhinged Princess">
<meta property="og:image" content="princess.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffe3ef;
    --bg2: #ffc4dc;
    --ink: #3a0d24;
    --pink: #e8367f;
    --card: #ffffffcc;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, #fff6 0 2px, transparent 3px) 0 0 / 46px 46px,
      radial-gradient(circle at 70% 60%, #fff8 0 1.5px, transparent 2.5px) 0 0 / 31px 31px,
      linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  /* Three rows: photo + title on top, sentence in the exact middle, equal space below. */
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: grid;
    grid-template-rows: minmax(min-content, 1fr) auto minmax(0, 1fr);
    text-align: center;
  }
  .top {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 18px;
  }
  .photo {
    height: clamp(130px, 24dvh, 230px);
    aspect-ratio: 3 / 4;
    border-radius: 999px 999px 22px 22px;
    overflow: hidden;
    border: 5px solid #fff;
    box-shadow: 0 0 0 2px var(--pink), 0 0 26px 4px #ffffffaa, 0 14px 30px -12px #c2185b66;
    transform: rotate(-3deg);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(2.2rem, 10vw, 3.1rem);
    line-height: 0.95;
    letter-spacing: 0;
    margin-top: 10px;
    position: relative;
    /* Glitter text: a moving shine sweeps across the pink. */
    background:
      linear-gradient(110deg, transparent 40%, #ff9cc8 50%, transparent 60%) 0 0 / 250% 100%,
      linear-gradient(180deg, #e8367f, #c2125f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(2px 2px 0 #fff) drop-shadow(0 4px 10px #e8367f44);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { background-position: 130% 0, 0 0; }
    60%, 100% { background-position: -30% 0, 0 0; }
  }
  h1 span { display: block; }
  .quote {
    position: relative;
    background: var(--card);
    border-radius: 22px;
    padding: 24px 20px;
    width: 100%;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px -14px #c2185b55;
    backdrop-filter: blur(6px);
  }
  /* Glitter border that slowly shimmers around the card. */
  .quote::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 26px;
    padding: 4px;
    background:
      radial-gradient(#fff 0.8px, transparent 1.3px) 0 0 / 7px 7px,
      linear-gradient(120deg, #ff8cc0, #fff, #f6b3ff, #ffd36e, #fff, #ff8cc0) 0 0 / 300% 100%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: border-glitter 4s linear infinite;
    pointer-events: none;
  }
  @keyframes border-glitter {
    to { background-position: 7px 7px, 300% 0; }
  }

  /* Twinkling sparkles scattered over the page. */
  .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .sparkles.front { z-index: 2; }
  .spark {
    position: absolute;
    width: var(--s);
    height: var(--s);
    background: var(--c, #fff);
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #ff8cc0);
    opacity: 0;
    animation: twinkle var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1) rotate(90deg); }
  }
  /* Falling glitter flecks. */
  .fleck {
    position: absolute;
    top: -10px;
    width: var(--s);
    height: var(--s);
    border-radius: 1px;
    background: var(--c);
    box-shadow: 0 0 4px var(--c);
    animation: fall var(--d) linear var(--delay) infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -10px) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    50%  { opacity: .3; }
    60%  { opacity: 1; }
    100% { transform: translate(var(--drift), 105vh) rotate(720deg); opacity: 0; }
  }
  /* Burst of sparkles when a new sentence appears. */
  .burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--s);
    height: var(--s);
    background: var(--c);
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    animation: burst .9s cubic-bezier(.15,.8,.3,1) forwards;
    pointer-events: none;
  }
  @keyframes burst {
    from { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(180deg); opacity: 0; }
  }
  #sentence {
    font-family: "DM Sans", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.35rem, 6.2vw, 1.7rem);
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: #2a0819;
    text-wrap: balance;
  }
  #sentence.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop {
    from { opacity: 0; transform: scale(.92) translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sentence.pop, h1, .quote::before { animation: none; }
    .fleck, .burst { display: none; }
    .spark { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<main>
  <div class="top">
    <div class="photo"><img src="princess.jpg" alt="The Unhinged Princess in a tiara, holding a heart wand"></div>
    <h1><span>Unhinged</span><span>Princess</span></h1>
  </div>
  <div class="quote" id="quote"><p id="sentence" aria-live="polite"></p></div>
  <div></div>
</main>
<div class="sparkles front" id="glitter" aria-hidden="true"></div>
<script>
  const SENTENCES = [
    "Bibi Netanyahu is kinda hot.",
    "Anti-vaxxers are just attention whores.",
    "I think LinkedIn is a dating app for psychopaths.",
    "No one knows what the fuck is happening in Ukraine.",
    "Elon Musk does botox.",
    "Jeff Bezos is not bald enough.",
    "Dating your cousin should be socially acceptable.",
    "Every wedding should include a speech from an ex.",
    "Vegans are unbearable people.",
    "Checking your partner's phone is a love language.",
    "Dating someone for their American citizenship is a beautiful love story.",
    "Harvard students should be required to pass a personality test.",
    "MIT students should be banned from flirting until they graduate.",
    "PhD is just a socially acceptable way to avoid getting a real job.",
    "ChatGPT has more emotional intelligence than most people.",
    "People who use Excel for personal finances have control issues.",
    "Queen Camilla was the victim and Princess Diana was the villain.",
    "We shower too much.",
    "If someone says their hobby is traveling, I immediately think they're boring.",
    "People should stop showing unsolicited photos of their pets.",
    "Taylor Swift is a cult leader and I respect her for it.",
    "Melania Trump is the most relatable woman alive. She clearly doesn't want to be there either.",
    "Kardashians have contributed more to humanity than most Nobel Prize winners.",
    "I would absolutely trust ChatGPT to decide which country deserves nuclear weapons.",
    "People who introduce themselves as “Dr.” outside a hospital have an unresolved childhood trauma.",
    "PhD students should have to compete in a reality show for their funding.",
    "Most economists are just astrologers with better Excel skills.",
    "Peer review should be replaced by anonymous Reddit comments.",
    "Universities should replace dissertation defenses with lie detector tests."
  ];

  // Shuffle-bag: every sentence shows once before any repeats, remembered across taps.
  const KEY = "unhinged-bag-v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function save(bag) { try { localStorage.setItem(KEY, JSON.stringify(bag)); } catch {} }

  function next() {
    let bag = load().filter(i => i < SENTENCES.length);
    if (!bag.length) {
      bag = SENTENCES.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }
    const idx = bag.pop();
    save(bag);
    return SENTENCES[idx];
  }

  const COLORS = ["#ffffff", "#ffd36e", "#ff8cc0", "#f6b3ff", "#fff2a8"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const rand = (a, b) => a + Math.random() * (b - a);

  // Twinkling stars behind the content.
  const sky = document.getElementById("sparkles");
  for (let i = 0; i < 48; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.style.cssText = `left:${rand(0, 100)}%;top:${rand(0, 100)}%;--s:${rand(12, 30)}px;--c:${pick(COLORS)};--d:${rand(1.8, 3.6)}s;--delay:${rand(0, 3)}s`;
    sky.appendChild(s);
  }
  // Glitter flecks drifting down in front.
  const glitter = document.getElementById("glitter");
  for (let i = 0; i < 45; i++) {
    const f = document.createElement("span");
    f.className = "fleck";
    f.style.cssText = `left:${rand(0, 100)}%;--s:${rand(4, 8)}px;--c:${pick(COLORS)};--d:${rand(6, 12)}s;--delay:${rand(-12, 0)}s;--drift:${rand(-40, 40)}px`;
    glitter.appendChild(f);
  }

  const el = document.getElementById("sentence");
  const quote = document.getElementById("quote");
  function burst() {
    for (let i = 0; i < 16; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      const angle = (i / 16) * Math.PI * 2 + rand(-0.2, 0.2);
      const dist = rand(110, 190);
      b.style.cssText = `--s:${rand(10, 18)}px;--c:${pick(COLORS)};--x:${Math.cos(angle) * dist}px;--y:${Math.sin(angle) * dist * 0.6}px`;
      quote.appendChild(b);
      b.addEventListener("animationend", () => b.remove());
    }
  }
  function show() {
    el.textContent = next();
    el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    burst();
  }
  // Re-roll when the page comes back from the browser's back/forward cache (e.g. a repeat NFC tap).
  window.addEventListener("pageshow", show);
</script>
</body>
</html>
